plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {

    signingConfigs {
        release {
            keyAlias 'gwyt_unify'
            keyPassword 'jwch2019'
            storeFile file('rskey/gwyt_unify.jks')
            storePassword 'jwch2019'
        }
    }

    namespace 'com.jwch.gwyt_project'
    compileSdk 34

    
    defaultConfig {
        applicationId "com.jwch.gwyt_project"
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName "1.1.21"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            ndk {
                abiFilters = ['armeabi-v7a']
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            ndk {
                abiFilters = ['armeabi-v7a']
            }
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    //设置jni引用地址
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
        jniLibs {
            useLegacyPackaging = true // 处理大文件的关键设置
        }
    }


    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "四乱现场核查平台${variant.versionName}.apk"
        }
    }

}

